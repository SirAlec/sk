<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smash Karts Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 25px 0 10px;
        }

        .game {
            width: 95%;
            max-width: 1200px;
            height: 700px;
            margin: 25px auto;
            border: 2px solid #444;
            border-radius: 12px;
            overflow: hidden;
            background: black;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <h1>🏎️ Smash Karts</h1>

    <div class="game">
        <iframe
            src="https://smashkarts.io/"
            title="Smash Karts"
            allowfullscreen>
        </iframe>
    </div>

</body>
</html>
